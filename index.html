<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול תקציב חכם - PWA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Rubik & Roboto Mono Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #0B132B;
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        .mono-num {
            font-family: 'Roboto Mono', monospace;
            direction: ltr;
            display: inline-block;
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.9) 0%, rgba(11, 19, 43, 0.95) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(58, 80, 107, 0.6);
        }
    </style>
</head>
<body class="min-h-screen pb-12 px-3 pt-3 max-w-md mx-auto select-none">

    <!-- 1. כותרת, מחזור ואינדיקטור סנכרון -->
    <div class="flex justify-between items-center mb-2 text-xs text-slate-400 font-medium">
        <span class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>מעודכן מ-Google Sheets</span>
        </span>
        <span class="bg-[#1C2541] px-2.5 py-1 rounded-full border border-[#3A506B] text-slate-200">10/10 - 09/11</span>
    </div>

    <!-- 2. Hero Card - יתרה פנויה -->
    <div class="glass-card rounded-2xl p-5 text-center mb-3 shadow-xl relative overflow-hidden">
        <div class="text-xs text-slate-400 font-medium mb-1">יתרה פנויה להוצאות משתנות</div>
        <div id="heroAvailable" class="text-4xl font-bold text-[#48CAE4] mono-num mb-4 tracking-tight">₪0.00</div>
        
        <div class="grid grid-cols-4 gap-1 pt-3 border-t border-[#3A506B]/50 text-[11px]">
            <div>
                <span class="text-slate-400 block text-[10px]">הכנסה</span>
                <span id="heroIncome" class="font-bold text-slate-100 mono-num mt-0.5">₪17,750</span>
            </div>
            <div>
                <span class="text-slate-400 block text-[10px]">משתנות</span>
                <span id="heroVariable" class="font-bold text-slate-100 mono-num mt-0.5">₪0</span>
            </div>
            <div>
                <span class="text-slate-400 block text-[10px]">קבועות</span>
                <span id="heroFixedDone" class="font-bold text-slate-100 mono-num mt-0.5">₪0</span>
            </div>
            <div>
                <span class="text-slate-400 block text-[10px]">בקנה</span>
                <span id="heroPending" class="font-bold text-[#E0A96D] mono-num mt-0.5">₪0</span>
            </div>
        </div>
    </div>

    <!-- 3. מד קצב ניצול התקציב (Pace Bar / Burn Rate) -->
    <div class="glass-card rounded-xl p-3.5 mb-3">
        <div class="flex justify-between items-center text-xs mb-1.5">
            <span class="font-semibold text-slate-200">קצב ניצול תקציב משתנה</span>
            <span class="text-[#4ADE80] font-bold text-[11px]">קצב מצוין (יום 10 מתוך 31)</span>
        </div>
        <div class="w-full bg-[#0B132B] h-2.5 rounded-full overflow-hidden p-0.5 border border-[#3A506B]">
            <div class="bg-gradient-to-r from-[#48CAE4] to-[#4ADE80] h-full rounded-full" style="width: 18%;"></div>
        </div>
        <div class="flex justify-between text-[10px] text-slate-400 mt-1.5 mono-num">
            <span>ניצול: ₪198 (2%)</span>
            <span>מומלץ ליום: ~₪350</span>
        </div>
    </div>

    <!-- 4. גרף פילוח קטגוריות בשקלים & היסטוריה -->
    <div class="glass-card rounded-2xl p-4 mb-4">
        <div class="flex border-b border-[#3A506B] mb-3 text-xs">
            <button onclick="switchChart('categories')" id="tabCat" class="pb-2 px-3 font-bold text-[#48CAE4] border-b-2 border-[#48CAE4]">פילוח קטגוריות (₪)</button>
            <button onclick="switchChart('history')" id="tabHist" class="pb-2 px-3 font-medium text-slate-400">היסטוריית מחזורים</button>
        </div>

        <div class="relative h-44">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <!-- 5. כותרת ותזרימי מחזור (Ledger) -->
    <div class="flex items-center justify-between mb-2.5 px-1">
        <h2 class="text-sm font-bold text-slate-200">תזרימי מחזור (לפי תאריך)</h2>
        <button onclick="openAddModal()" class="bg-[#3A506B]/60 hover:bg-[#3A506B] text-[#48CAE4] text-xs px-2.5 py-1 rounded-lg border border-[#3A506B] font-semibold transition active:scale-95">
            + צפויה חדשה
        </button>
    </div>

    <div id="ledgerContainer" class="space-y-2 mb-4">
        <!-- נטען דינמית ב-JS -->
    </div>

    <!-- 6. Modal - הוספה / עריכה של הוצאה צפויה -->
    <div id="expenseModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#1C2541] border border-[#3A506B] w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="font-bold text-base text-slate-100">הוספת הוצאה צפויה</h3>
                <button onclick="closeModal()" class="text-slate-400 text-lg p-1">✕</button>
            </div>
            
            <div class="space-y-3 mb-5">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">שם ההוצאה / העסק:</label>
                    <input type="text" id="inputName" class="w-full bg-[#0B132B] border border-[#3A506B] rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-[#48CAE4]">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">סכום צפוי (₪):</label>
                    <input type="number" id="inputAmount" class="w-full bg-[#0B132B] border border-[#3A506B] rounded-xl p-2.5 text-base font-bold text-[#48CAE4] mono-num focus:outline-none focus:border-[#48CAE4]">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">תאריך צפוי:</label>
                        <input type="text" id="inputDate" placeholder="DD/MM/YYYY" class="w-full bg-[#0B132B] border border-[#3A506B] rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-[#48CAE4]">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">קטגוריה:</label>
                        <select id="inputCat" class="w-full bg-[#0B132B] border border-[#3A506B] rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-[#48CAE4]">
                            <option value="דיור">דיור</option>
                            <option value="תשתיות">תשתיות</option>
                            <option value="חיות מחמד">חיות מחמד</option>
                            <option value="מיסים">מיסים</option>
                            <option value="תקשורת">תקשורת</option>
                            <option value="מסעדות">מסעדות</option>
                            <option value="מזון">מזון</option>
                            <option value="דיגיטל">דיגיטל</option>
                            <option value="שונות">שונות</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="saveExpense()" class="flex-1 bg-[#48CAE4] hover:bg-[#3dbbd6] text-[#0B132B] py-3 rounded-xl font-bold text-sm transition active:scale-[0.98]">שמירה ועדכון</button>
                <button onclick="closeModal()" class="bg-[#3A506B]/50 hover:bg-[#3A506B] text-slate-300 px-4 py-3 rounded-xl font-semibold text-sm">ביטול</button>
            </div>
        </div>
    </div>

    <!-- JavaScript - לוגיקה וגרפים -->
    <script>
        const income = 17750;
        let activeEditId = null;
        let chartInstance = null;
        let currentChartType = 'categories';

        // נתוני העסקאות
        let transactions = [
            { id: 1, name: "שכירות / משכנתא", cat: "דיור", amount: 4500, date: "25/10/2026", status: "pending" },
            { id: 2, name: "סולמייט", cat: "חיות מחמד", amount: 857, date: "28/10/2026", status: "pending" },
            { id: 3, name: "עיריית בני ברק", cat: "מיסים", amount: 541.6, date: "01/11/2026", status: "pending" },
            { id: 4, name: "חברת החשמל", cat: "תשתיות", amount: 350, date: "01/11/2026", status: "pending" },
            { id: 5, name: "אינטרנט וטלפון", cat: "תקשורת", amount: 150, date: "05/11/2026", status: "pending" },
            { id: 6, name: "WOLT", cat: "מסעדות", amount: 143, date: "09/10/2026", status: "done" },
            { id: 7, name: "GOOGLE SMART FUN", cat: "דיגיטל", amount: 30, date: "09/10/2026", status: "done" },
            { id: 8, name: "מאפה נאמן בני ברק", cat: "מזון", amount: 25, date: "08/10/2026", status: "done" }
        ];

        function recalculateHero() {
            let pendingTotal = 0;
            let variableTotal = 0;

            transactions.forEach(item => {
                if (item.status === 'pending') {
                    pendingTotal += item.amount;
                } else if (item.status === 'done') {
                    variableTotal += item.amount;
                }
            });

            const available = income - (pendingTotal + variableTotal);

            document.getElementById('heroAvailable').innerText = `₪${available.toLocaleString('he-IL', {minimumFractionDigits: 2})}`;
            document.getElementById('heroVariable').innerText = `₪${variableTotal.toLocaleString('he-IL')}`;
            document.getElementById('heroPending').innerText = `₪${pendingTotal.toLocaleString('he-IL')}`;
        }

        function calculateCategoryTotals() {
            const totals = {};
            transactions.forEach(item => {
                if (item.status === 'done') {
                    const cat = item.cat || 'שונות';
                    totals[cat] = (totals[cat] || 0) + item.amount;
                }
            });
            return totals;
        }

        function initCategoryChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const catTotals = calculateCategoryTotals();
            const labels = Object.keys(catTotals);
            const dataValues = Object.values(catTotals);

            if (labels.length === 0) {
                labels.push('אין עסקאות עדיין');
                dataValues.push(1);
            }

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: ['#48CAE4', '#E0A96D', '#4ADE80', '#F43F5E', '#A855F7', '#64748B'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            position: 'right', 
                            labels: { 
                                color: '#F8FAFC', 
                                font: { family: 'Rubik', size: 10 },
                                generateLabels: function(chart) {
                                    const data = chart.data;
                                    return data.labels.map((label, i) => {
                                        const val = data.datasets[0].data[i];
                                        return {
                                            text: `${label}: ₪${val.toLocaleString('he-IL')}`,
                                            fillStyle: data.datasets[0].backgroundColor[i],
                                            hidden: false,
                                            index: i
                                        };
                                    });
                                }
                            } 
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.label}: ₪${context.raw.toLocaleString('he-IL')}`;
                                }
                            }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        function initHistoryChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר'],
                    datasets: [{
                        data: [12027, 27293, 13568, 5157],
                        backgroundColor: '#3A506B',
                        hoverBackgroundColor: '#48CAE4',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94A3B8', font: { family: 'Rubik', size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: '#94A3B8', font: { family: 'Roboto Mono', size: 9 } }, grid: { color: '#1C2541' } }
                    }
                }
            });
        }

        function switchChart(type) {
            currentChartType = type;
            if (type === 'categories') {
                document.getElementById('tabCat').className = 'pb-2 px-3 font-bold text-[#48CAE4] border-b-2 border-[#48CAE4]';
                document.getElementById('tabHist').className = 'pb-2 px-3 font-medium text-slate-400';
                initCategoryChart();
            } else {
                document.getElementById('tabHist').className = 'pb-2 px-3 font-bold text-[#48CAE4] border-b-2 border-[#48CAE4]';
                document.getElementById('tabCat').className = 'pb-2 px-3 font-medium text-slate-400';
                initHistoryChart();
            }
        }

        function renderLedger() {
            const container = document.getElementById('ledgerContainer');
            container.innerHTML = '';

            transactions.forEach(item => {
                const isPending = item.status === 'pending';
                const borderClass = isPending ? 'border-r-4 border-r-[#E0A96D]' : 'border-r-4 border-r-[#4ADE80]';
                const statusBadge = isPending 
                    ? `<span class="text-[10px] text-[#E0A96D] bg-[#E0A96D]/10 px-2 py-0.5 rounded-full font-medium">בקנה (לחץ לעריכה)</span>`
                    : `<span class="text-[10px] text-[#4ADE80] bg-[#4ADE80]/10 px-2 py-0.5 rounded-full font-medium">ירד בבנק</span>`;
                
                const card = document.createElement('div');
                card.className = `bg-[#1C2541] border border-[#3A506B]/70 ${borderClass} rounded-xl p-3 flex justify-between items-center ${isPending ? 'cursor-pointer hover:border-slate-400' : ''}`;
                
                if (isPending) {
                    card.onclick = () => openEditModal(item);
                }

                card.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] text-slate-400 font-medium">${item.date}</span>
                            ${statusBadge}
                        </div>
                        <div class="font-semibold text-sm text-slate-100">${item.name}</div>
                        <div class="text-[11px] text-slate-400">${item.cat}</div>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-sm mono-num ${isPending ? 'text-[#E0A96D]' : 'text-slate-100'}">₪${item.amount.toLocaleString('he-IL', {minimumFractionDigits: 1})}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            recalculateHero();
            if (currentChartType === 'categories') {
                initCategoryChart();
            }
        }

        function openAddModal() {
            activeEditId = null;
            document.getElementById('modalTitle').innerText = "הוספת הוצאה צפויה חדשה";
            document.getElementById('inputName').value = "";
            document.getElementById('inputAmount').value = "";
            document.getElementById('inputDate').value = new Date().toLocaleDateString('he-IL');
            document.getElementById('expenseModal').classList.remove('hidden');
        }

        function openEditModal(item) {
            activeEditId = item.id;
            document.getElementById('modalTitle').innerText = `עריכת הוצאה צפויה: ${item.name}`;
            document.getElementById('inputName').value = item.name;
            document.getElementById('inputAmount').value = item.amount;
            document.getElementById('inputDate').value = item.date;
            document.getElementById('inputCat').value = item.cat || 'שונות';
            document.getElementById('expenseModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('expenseModal').classList.add('hidden');
        }

        function saveExpense() {
            const name = document.getElementById('inputName').value;
            const amount = parseFloat(document.getElementById('inputAmount').value);
            const date = document.getElementById('inputDate').value;
            const cat = document.getElementById('inputCat').value;

            if (!name || isNaN(amount) || amount <= 0) return;

            if (activeEditId) {
                const item = transactions.find(t => t.id === activeEditId);
                if (item) {
                    item.name = name;
                    item.amount = amount;
                    item.date = date;
                    item.cat = cat;
                }
            } else {
                transactions.unshift({
                    id: Date.now(),
                    name: name,
                    cat: cat,
                    amount: amount,
                    date: date,
                    status: 'pending'
                });
            }

            closeModal();
            renderLedger();
        }

        // טעינה ראשונית
        renderLedger();
        initCategoryChart();
    </script>
</body>
</html>
